<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Social Science Quiz - Verified Version</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --success-color: #2ec4b6;
            --error-color: #e71d36;

            /* Tab Colors */
            --tab-default-bg: #34495e;
            --tab-active-bg: #e67e22;
            --tab-download-bg: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Pyidaungsu';
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 100px;
            line-height: 1.8;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .quiz-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .score-board {
            background-color: #fff3cd;
            border: 2px solid #ffeeba;
            border-left: 8px solid var(--tab-active-bg);
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            color: #856404;
            text-align: center;
            display: none;
        }

        .question-item {
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .question-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* Underline-only Blank Style */
        .blank-input {
            border: none;
            border-bottom: 2px solid #666;
            padding: 0px 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: var(--secondary-color);
            width: 220px;
            background: transparent;
            border-radius: 0;
            transition: border-bottom-color 0.3s, color 0.3s;
        }

        .blank-input:focus {
            outline: none;
            border-bottom-color: var(--primary-color);
        }

        .blank-input.correct {
            border-bottom-color: var(--success-color);
            color: var(--success-color);
        }

        .blank-input.incorrect {
            border-bottom-color: var(--error-color);
            color: var(--error-color);
        }

        .feedback-text {
            font-size: 14px;
            margin-top: 5px;
            display: block;
            font-weight: 500;
        }

        .feedback-text.correct {
            color: var(--success-color);
        }

        .feedback-text.incorrect {
            color: var(--error-color);
        }

        /* Tabs Layout */
        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            margin: 30px 0 15px 0;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .tab-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 10px;
            border: none;
            border-radius: 6px;
            background-color: var(--tab-default-bg);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            text-align: center;
            margin: 6px;
        }

        .tab-btn:hover {
            background-color: #4f5d73;
        }

        .tab-btn.active {
            background-color: var(--tab-active-bg);
        }

        .tab-btn.download-btn {
            background-color: var(--tab-download-bg);
        }

        /* Action Buttons Layout */
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-check {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-check:hover {
            background-color: var(--secondary-color);
        }

        .btn-retry {
            background-color: #6c757d;
            color: white;
        }

        .btn-retry:hover {
            background-color: #5a6268;
        }

        .download-panel {
            text-align: center;
            padding: 40px 20px;
            background: #f9f9f9;
            border: 2px dashed #ccc;
            border-radius: 6px;
        }

        .pdf-link-btn {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #222;
            color: #aaa;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            z-index: 1000;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 18px;
            }

            .quiz-panel {
                padding: 15px;
            }

            .score-board {
                font-size: 18px;
            }

            .blank-input {
                width: 140px;
                display: inline-block;
                margin: 0 3px;
                text-align: center;
            }

            .btn-container {
                display: flex;
                flex-direction: row;
                gap: 10px;
            }

            .action-btn {
                padding: 12px 5px;
                font-size: 14px;
            }

            .tabs-container {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
                margin: 4px 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>လူမှုရေးသိပ္ပံ မေးခွန်းလွှာများ (Interactive Quiz)</h1>
    </header>

    <div class="container">
        <div class="quiz-panel">
            <div class="score-board" id="scoreBoard"></div>
            <div id="quizQuestions"></div>

            <!-- Tabs Menu -->
            <div class="tabs-container" id="tabsMenu">
                <button class="tab-btn active" id="tab1" onclick="switchTab(1)">လူမှုဆက်နွယ်ရေး</button>
                <button class="tab-btn" id="tab2" onclick="switchTab(2)">ပြည်သူ့ဆက်ဆံရေး</button>
                <button class="tab-btn" id="tab3" onclick="switchTab(3)">ဆက်ဆံရေးပညာ</button>
                <button class="tab-btn" id="tab4" onclick="switchTab(4)">ပြည်သူ့နီတိ</button>
                <button class="tab-btn download-btn" id="tab5" onclick="switchTab(5)">📄 PDF ဒေါင်းလုတ်</button>
            </div>

            <!-- Action Buttons -->
            <div class="btn-container" id="actionButtons">
                <button class="action-btn btn-check" onclick="checkAnswers()">Check Answer</button>
                <button class="action-btn btn-retry" onclick="tryAgain()">Try Again</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 All Rights Reserved | Student Number 142

        function toMyanmarNumbers(num) {
            const myanmarNumbers = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];
            return num.toString().split('').map(d => myanmarNumbers[d] || d).join('');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

            if (tabId === 5) {
                loadDownloadPanel();
                document.getElementById('actionButtons').style.display = 'none';
            } else {
                loadQuestions();
                document.getElementById('actionButtons').style.display = 'flex';
            }
        }

        function loadQuestions() {
            const questionsContainer = document.getElementById('quizQuestions');
            questionsContainer.innerHTML = '';
            shuffledQuestions = shuffle([...quizData[currentTab]]);

            shuffledQuestions.forEach((item, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-item';

                // မေးခွန်းနံပါတ်စဉ်ကို ၁ မှစတင်၍ အစဉ်လိုက်အတိုင်း မြန်မာလို အမြဲပေါ်စေခြင်း
                const displayNo = toMyanmarNumbers(index + 1);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${displayNo}။ ${item.q1} <input type="text" class="blank-input" data-index="${index}"> ${item.q2}`;

                const feedback = document.createElement('span');
                feedback.className = 'feedback-text';
                feedback.id = `feedback-${index}`;

                qDiv.appendChild(qText);
                qDiv.appendChild(feedback);
                questionsContainer.appendChild(qDiv);
            });
        }

        function loadDownloadPanel() {
            const questionsContainer = document.getElementById('quizQuestions');
            questionsContainer.innerHTML = `
            <div class="download-panel">
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #2c3e50;">People Relation_2.pdf မူရင်းဖိုင် ရယူရန်</div>
                <p style="margin-bottom: 25px; color: #666; font-size: 14px;">မေးခွန်းများပါဝင်သော မူရင်းစာရွက်စာတမ်း PDF ဖိုင်ကို အောက်ပါခလုတ်မှတစ်ဆင့် ရယူနိုင်ပါသည်။</p>
                <a href="People Relation_2.pdf" download="People Relation_2.pdf" class="pdf-link-btn">
                     📥 PDF File အားဒေါင်းလုတ်ပြုလုပ်ရန်
                </a>
            </div>
        `;
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('.blank-input');
            let score = 0;

            inputs.forEach((input) => {
                const index = input.getAttribute('data-index');
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = shuffledQuestions[index].a.trim().toLowerCase();
                const feedback = document.getElementById(`feedback-${index}`);

                if (userAnswer === correctAnswer || userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '')) {
                    input.className = 'blank-input correct';
                    feedback.textContent = '✓ မှန်ကန်ပါသည်။';
                    feedback.className = 'feedback-text correct';
                    score++;
                } else {
                    input.className = 'blank-input incorrect';
                    feedback.textContent = `✗ မှားယွင်းပါသည်။ အဖြေမှန်မှာ: [ ${shuffledQuestions[index].a} ]`;
                    feedback.className = 'feedback-text incorrect';
                }
            });

            const scoreBoard = document.getElementById('scoreBoard');
            scoreBoard.innerHTML = `🎯 ယခုအပိုင်းရမှတ်: ${score} / ${shuffledQuestions.length} မှတ် ရရှိပါသည်။`;
            scoreBoard.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function tryAgain() {
            document.getElementById('scoreBoard').style.display = 'none';
            loadQuestions();
        }

        window.onload = function () { loadQuestions(); };
    </script>

</body>

</html>
